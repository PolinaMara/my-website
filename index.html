<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            /* ИЗМЕНЕНИЕ 1: Розовый фон */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; font-size: 2.5em; color: #d63384; }
        h2 { color: #d63384; margin-top: 0; }
        p { font-size: 1.1em; opacity: 0.9; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #ff69b4;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        
        /* ИЗМЕНЕНИЕ 2: Стили для нового раздела */
        .about-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ff69b4;
        }
        .cat-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            margin-top: 15px;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .photos {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 15px;
    flex-wrap: wrap;
}
.photo {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    border: 3px solid white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет! Я Полина 👋</h1>
        <p>Это мой первый сайт, созданный с помощью AI-агента для лабораторной работы.</p>
        <p>Я изучаю IT, и у меня всё получается!</p>
        <a href="#" class="btn">Связаться со мной</a>

        <!-- ИЗМЕНЕНИЕ 3: Новый раздел "Обо мне" и котик -->
        <div class="about-section">
    <h2>Обо мне</h2>
    <p>Я студентка GUAP, изучаю IT</p>
    
    <h3>Мои интересы</h3>
    <div class="photos">
        <img src="https://picsum.photos/seed/cat1/200/200" alt="Фото 1" class="photo">
        <img src="https://picsum.photos/seed/cat2/200/200" alt="Фото 2" class="photo">
        <img src="https://picsum.photos/seed/cat3/200/200" alt="Фото 3" class="photo">
    </div>
</div>
</body>
</html>
